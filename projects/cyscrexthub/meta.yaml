name: CYSCREXTHUB
slug: cyscrexthub
summary: CYSCREXTHUB，发现更多的scratch扩展！
description: |-
  **CY ScrExt Hub** 是我独立开发并运营的 Scratch 扩展资源平台，致力于为 Scratch 创作者提供一站式的扩展发现、下载与学习体验。平台汇聚了众多热门且实用的 Scratch 扩展，涵盖人工智能、游戏开发、界面设计、数学运算等多个领域，帮助用户轻松实现更多创意功能，让编程创作更上一层楼。
  平台的核心价值在于"精选"与"可信"。所有上架扩展均经过严格筛选与实际测试，确保安全性和稳定性，让用户可以放心使用每一个扩展资源。

  除了资源聚合，我还希望把 CY ScrExt Hub 打造成一个活跃的创作者社区。平台鼓励扩展开发者提交自己的作品，经审核后即可上线展示；通过 QQ 交流群与 B 站账号，创作者们可以交流灵感、讨论技术、协作优化作品。此外，站内还提供扩展开发教程与最佳实践，帮助更多人从零开始制作属于自己的 Scratch 扩展。
  自上线以来，CY ScrExt Hub 已持续迭代至 v2.0.7，不断优化访问统计、页面体验与扩展收录质量。如果你对 Scratch 扩展开发感兴趣，欢迎访问 ext.cyscrhub.top，加入我们的社区，一起推动 Scratch 创意生态的发展。
